  <text x="1223" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">Research Project</text>
  <text x="1223" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">Python, MNE, OpenBCI,</text>
  <text x="1223" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">PSD, band power,</text>
  <text x="1223" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">robot control pipeline</text>
  <rect x="1111" y="537" width="224" height="36" rx="18" fill="rgb(242, 242, 240)" stroke="rgb(180, 180, 178)" stroke-width="1"></rect>
  <text x="1223" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="rgb(95, 95, 95)">signal → feature → decision</text>

