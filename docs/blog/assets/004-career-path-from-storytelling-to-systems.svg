  <rect x="1080.5" y="290" width="285" height="305" rx="24" fill="white" stroke="rgb(70, 70, 70)" stroke-width="3"></rect>
  <rect x="1080.5" y="290" width="285" height="66" rx="24" fill="rgb(235, 235, 232)"></rect>
