  </text>

  <line x1="337.5" y1="432.5" x2="1462.5" y2="432.5" stroke="rgb(80, 80, 80)" stroke-width="5"></line>

  <!-- Node 1 -->
  <rect x="60.5" y="290" width="285" height="305" rx="24" fill="white" stroke="rgb(70, 70, 70)" stroke-width="3"></rect>
  <rect x="60.5" y="290" width="285" height="66" rx="24" fill="rgb(235, 235, 232)"></rect>
  <text x="203" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">Storytelling</text>
  <text x="203" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">Literature / Theater</text>
  <text x="203" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">Structure in meaning</text>
  <text x="203" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">Causality, tension,</text>
  <text x="203" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">character, timing</text>
  <rect x="103" y="537" width="200" height="36" rx="18" fill="rgb(242, 242, 240)" stroke="rgb(180, 180, 178)" stroke-width="1"></rect>
  <text x="203" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="rgb(95, 95, 95)">pattern in experience</text>

