  <text x="883" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">Engineering</text>
  <text x="883" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">Mechanisms, constraints,</text>
