  <polygon points="1403,432.5 1383,419.5 1383,445.5" fill="rgb(80, 80, 80)"></polygon>

  <!-- Node 5 -->
  <rect x="1420.5" y="290" width="285" height="305" rx="24" fill="white" stroke="rgb(70, 70, 70)" stroke-width="3"></rect>
  <rect x="1420.5" y="290" width="285" height="66" rx="24" fill="rgb(235, 235, 232)"></rect>
  <text x="1563" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">Computational</text>
  <text x="1563" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">Neuroscience</text>
  <text x="1563" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">Neural dynamics,</text>
  <text x="1563" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">state transitions,</text>
  <text x="1563" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">measurable systems</text>
  <rect x="1476" y="537" width="174" height="36" rx="18" fill="rgb(242, 242, 240)" stroke="rgb(180, 180, 178)" stroke-width="1"></rect>
  <text x="1563" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="rgb(95, 95, 95)">patterns over time</text>

  <text x="900" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="rgb(30, 30, 30)">
    Current practice: turning large questions into smaller, measurable, reproducible research steps.
  </text>

  <text x="900" y="815" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">
    writing → strategy → engineering → EEG-BCI → computational neuroscience
  </text>
