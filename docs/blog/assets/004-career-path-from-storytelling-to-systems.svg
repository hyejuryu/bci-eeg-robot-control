  <text x="543" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="rgb(30, 30, 30)">AI Infrastructure</text>
  <text x="543" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">Translating technical</text>
  <text x="543" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">complexity into decisions</text>
  <text x="543" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">and market language</text>
  <rect x="448" y="537" width="190" height="36" rx="18" fill="rgb(242, 242, 240)" stroke="rgb(180, 180, 178)" stroke-width="1"></rect>
  <text x="543" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="rgb(95, 95, 95)">complexity → structure</text>

