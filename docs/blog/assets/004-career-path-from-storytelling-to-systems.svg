  <text x="883" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="rgb(95, 95, 95)">implementation</text>
  <rect x="792" y="537" width="182" height="36" rx="18" fill="rgb(242, 242, 240)" stroke="rgb(180, 180, 178)" stroke-width="1"></rect>
  <text x="883" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="rgb(95, 95, 95)">ideas must operate</text>

